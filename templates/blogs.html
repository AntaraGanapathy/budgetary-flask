    {% for article in articles %}
    <div class="w3-card-4 w3-margin w3-white">
        <div class="w3-container">
            <h3><b>{{article.title}}</b></h3>
            <h5>{{article.author}}, <span class="w3-opacity">{{article.date}}</span></h5>
        </div>

        <div class="w3-container">
            <p>{{article.desc}}</p>
            <div class="w3-row">
                <div class="w3-col m8 s12">
                    <p><a class="w3-button w3-padding-large w3-white w3-border" href="{{article.link}}" target=”_blank”><b>READ MORE
                                »</b></button></p>
                </div>
            </div>
        </div>
    </div>
