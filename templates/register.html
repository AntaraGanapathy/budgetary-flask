<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/main.css') }}">
    <!-- <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/form.css') }}"> -->
    <title>Register</title>
</head>

<body>
    <h1 style="margin-top: 5%;">Registration Page</h1>

    <div class="container" style="margin-top: 8%;">
        <form method="POST" action="" class="form">
            {{ form.hidden_tag() }}
            {{ form.username.label(class = 'form__label') }}
            {{ form.username(class = 'form__input') }} <br>
            {{ form.password.label(class = 'form__label') }}
            {{ form.password(class = 'form__input') }} <br>
            {{ form.submit(id = 'button-reg') }}
        </form>

        <div class='alt-form'>
            <p style="margin-right: 5px;">Already have an account?</p> <a href="{{url_for('login')}}">Login</a>
        </div>
    </div>

</body>

</html>
